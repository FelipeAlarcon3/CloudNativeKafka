# Clúster de 3 brokers + ZooKeeper + Kafka UI  (caso 2: se cae un broker y el clúster sigue)
#   docker compose -f docker-compose.cluster.yml up -d
#   export KAFKA_BROKERS=localhost:9092,localhost:9093,localhost:9094
#   export REPLICATION_FACTOR=3
#   npm run setup && npm run replicas -- --watch
#   docker stop cno-kafka-2          # y mira cómo cambian líder e ISR
# Kafka UI: http://localhost:8081
# Apaga antes docker-compose.yml (mismos nombres de contenedor y puerto 9092). Si usas ../zookeeper con
# --profile kafka, también apágalo: ocupa 9093 y 9094.
x-broker-env: &broker-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cno-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cno-kafka-1
    depends_on: [zookeeper]
    ports: ['9092:9092']
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cno-kafka-2
    depends_on: [zookeeper]
    ports: ['9093:9093']
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9093

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cno-kafka-3
    depends_on: [zookeeper]
    ports: ['9094:9094']
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9094

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: cno-kafka-ui
    depends_on: [kafka-1, kafka-2, kafka-3]
    ports: ['8081:8080']
    environment:
      KAFKA_CLUSTERS_0_NAME: cloudnativeorders-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
