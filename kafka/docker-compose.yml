# Kafka de 1 broker + ZooKeeper + Kafka UI  (casos 1, 3 y 4)
#   docker compose up -d        -> Kafka en localhost:9092 · Kafka UI en http://localhost:8081
# Para el caso 2 (caída de broker) usa docker-compose.cluster.yml (apaga este antes: usan los mismos nombres/puertos).
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cno-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cno-kafka-1
    depends_on: [zookeeper]
    ports: ['9092:9092']
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000   
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: cno-kafka-ui
    depends_on: [kafka-1]
    ports: ['8081:8080']
    environment:
      KAFKA_CLUSTERS_0_NAME: cloudnativeorders
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
